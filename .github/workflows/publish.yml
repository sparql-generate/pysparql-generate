# Publish on a version tag vX.Y.Z (the version of pyproject.toml) to PyPI, by
# trusted publishing: no token; the PyPI project "pysparql-generate" trusts
# this repository, this workflow and the environment "pypi".
name: Publish

on:
  push:
    tags: ['v*']

jobs:
  test:
    uses: ./.github/workflows/test.yml

  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the version against the tag
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
